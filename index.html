<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#073a53">
  <meta name="description" content="Assistant Marine Corail pour choisir un antifouling, une peinture ou une résine et estimer les quantités nécessaires.">
  <title>Marine Corail — Conseiller peinture</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip-link" href="#app">Aller au contenu</a>

  <header class="topbar">
    <button class="brand" type="button" data-action="home" aria-label="Retour à l'accueil">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 54 54" role="img">
          <path d="M27 6c-2 8-7 10-15 9 7 5 8 11 4 18 8-4 13-1 16 7 1-9 6-12 14-10-6-6-5-12 1-18-8 3-14 1-20-6Z" fill="currentColor"/>
          <circle cx="27" cy="26" r="5" fill="#fff"/>
        </svg>
      </span>
      <span>
        <strong>MARINE CORAIL</strong>
        <small>Le bon produit. La juste quantité.</small>
      </span>
    </button>

    <div class="topbar-actions">
      <span class="demo-badge" title="Les références, conditionnements et prix doivent être validés avec le catalogue magasin">
        Catalogue à valider
      </span>
      <button class="icon-button" type="button" data-action="fullscreen" aria-label="Afficher en plein écran" title="Plein écran">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 3H3v5M16 3h5v5M8 21H3v-5m13 5h5v-5"/></svg>
      </button>
      <button class="icon-button" type="button" data-action="reset" aria-label="Recommencer" title="Recommencer">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4v6h6M5.5 15a7 7 0 1 0 .7-7.8L4 10"/></svg>
      </button>
    </div>
  </header>

  <main id="app" tabindex="-1">
    <noscript>
      <section class="notice-card">Cette application nécessite JavaScript pour calculer les quantités.</section>
    </noscript>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <template id="icon-arrow">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
  </template>

  <script src="catalogue.js"></script>
  <script src="app.js"></script>
</body>
</html>
